name: Build MB
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o aurum-mb-projeto.zip -d proj
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: cd proj/aurum-mb && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Aurum-MB-APK
          path: proj/aurum-mb/app/build/outputs/apk/debug/app-debug.apk
